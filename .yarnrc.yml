yarnPath: .yarn/releases/yarn-4.15.0.cjs

# Use real node_modules — PnP breaks Next.js + Prisma + Tauri in subtle ways.
nodeLinker: node-modules

# Supply-chain hardening: refuse to run any package's build/postinstall script
# by default. Per-package opt-in via dependenciesMeta.<pkg>.built in package.json.
enableScripts: false

# Abort install if any tarball checksum mismatches the lockfile. No silent
# substitution of compromised packages.
checksumBehavior: throw

# Don't hoist deps outside their workspace — prevents phantom-dep accidents.
nmHoistingLimits: workspaces
