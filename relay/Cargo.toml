[package]
name = "voidchat-relay"
version = "0.1.0"
edition = "2021"
description = "Void Chat relay — replaces server/socket-server.ts as a self-contained Rust binary"
license = "MIT"

[[bin]]
name = "voidchat-relay"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }

# HTTP + WebSocket
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
hyper = "1"

# Socket.io protocol (matches existing JS client wire format)
socketioxide = "0.16"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Crypto
argon2 = "0.5"
ed25519-dalek = { version = "2", features = ["std"] }
sha2 = "0.10"
getrandom = "0.2"
constant_time_eq = "0.3"

# Base58 (matches bs58 in TypeScript client)
bs58 = "0.5"

# Time + logging
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
# Smaller binary; the relay is small enough that this is essentially free.
lto = "thin"
codegen-units = 1
strip = true
