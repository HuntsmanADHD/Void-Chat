[package]
name = "voidchat"
version = "0.1.0"
description = "Void Chat — Tor-routed private messenger"
authors = ["HuntsmanADHD"]
license = "MIT"
repository = "https://github.com/HuntsmanADHD/Void-Chat"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "voidchat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "net", "macros", "time"] }
tokio-socks = "0.5"
ctrlc = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
