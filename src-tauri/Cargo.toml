[package]
name = "voidchat"
version = "0.1.0"
description = "Void Chat — Tor-routed private messenger"
authors = ["HuntsmanADHD"]
license = "MIT"
repository = "https://github.com/HuntsmanADHD/Void-Chat"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "voidchat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "net", "macros", "time"] }
tokio-socks = "0.5"
ctrlc = "3"
getrandom = "0.2"
# Audit pt6 H7: backup encrypt now happens Rust-side so the .onion
# secret never lands in renderer JS memory. Wash format = PBKDF2-SHA256
# + AES-256-GCM — must match `src/lib/wash.ts` exactly so existing
# `.washed` backups still decrypt.
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
