# ─────────────────────────────────────────────────────────────────────────────
# Void Chat — self-host stack
#
#   docker compose up -d
#
# Brings up:
#   - web    Next.js app on http://localhost:3000
#   - relay  Socket relay on  ws://localhost:3001
#
# Data lives in ./data/voidchat.db (SQLite). Back up the whole ./data
# directory to back up your server.
#
# Edit .env to change ports, CORS origins, or expose a relay URL override.
# ─────────────────────────────────────────────────────────────────────────────

services:
  web:
    build: .
    image: voidchat:latest
    container_name: voidchat-web
    restart: unless-stopped
    environment:
      DATABASE_URL: "file:../data/voidchat.db"
      NODE_ENV: production
      # Override if you proxy the relay through a non-default host/path.
      NEXT_PUBLIC_VOID_RELAY_URL: ${NEXT_PUBLIC_VOID_RELAY_URL:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      # Named volume → Docker manages permissions; no UID-mismatch pain when
      # bind-mounting on Linux. To back up: see README.
      - voidchat_data:/app/data
    depends_on:
      - relay

  relay:
    # Reuses the image built by the `web` service. If you're running with a
    # registry image instead of `build:`, change both to `image: voidchat:...`.
    image: voidchat:latest
    container_name: voidchat-relay
    restart: unless-stopped
    # Skip the schema-push prelude — relay never touches the DB.
    command: ["node", "node_modules/tsx/dist/cli.mjs", "server/socket-server.ts"]
    environment:
      SOCKET_PORT: 3001
      # Comma-separated origin allowlist. Use "*" for LAN-only setups where
      # you don't care what address friends type. Do NOT use "*" on the
      # public internet — it disables CORS protection.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "${RELAY_PORT:-3001}:3001"

volumes:
  voidchat_data:
